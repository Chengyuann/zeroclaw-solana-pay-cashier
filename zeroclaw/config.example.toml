[skills]
allow_scripts = false

[sop]
sops_dir = "zeroclaw/sops"
maintenance_interval_secs = 60
persist_runs = true
execution_mode = "supervised"

[cashier]
# Public-network invoices require two different full-method RPC providers.
primary_rpc_url = "https://your-primary-rpc.example"
witness_rpc_url = "https://your-independent-rpc.example"
payer_rpc_url = "https://your-transaction-capable-rpc.example"

[runtime_profiles.cashier.tool_receipts]
enabled = true
inject_system_prompt = true
show_in_response = true

# Configure a real owner-facing channel through `zeroclaw quickstart`.
# The stock CLI channel is sufficient for local reproduction.
