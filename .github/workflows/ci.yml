name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Verify console assets
        run: npm run check:console

      - name: Build public console
        run: npm run pages:build && npm run pages:check

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Install ZeroClaw v0.8.3
        run: |
          curl -fL \
            https://github.com/zeroclaw-labs/zeroclaw/releases/download/v0.8.3/zeroclaw-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/zeroclaw.tar.gz
          mkdir -p /tmp/zeroclaw-release
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/zeroclaw.tar.gz -C /tmp/zeroclaw-release
          find /tmp/zeroclaw-release -type f -name zeroclaw -perm -111 \
            -exec cp {} "$HOME/.local/bin/zeroclaw" \;
          test -x "$HOME/.local/bin/zeroclaw"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Audit ZeroClaw skill
        run: zeroclaw skills audit zeroclaw/skills/solana-pay-cashier

      - name: Validate ZeroClaw SOPs
        run: |
          mkdir -p /tmp/zeroclaw-ci
          cat >/tmp/zeroclaw-ci/config.toml <<EOF
          schema_version = 3

          [sop]
          sops_dir = "${GITHUB_WORKSPACE}/zeroclaw/sops"
          EOF
          zeroclaw sop validate --config-dir /tmp/zeroclaw-ci

  proof-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeroclaw/plugins/proof-bundle-verify
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.1"
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeroclaw/plugins/proof-bundle-verify

      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: "1.255.0"

      - run: ../../../scripts/verify-proof-plugin.sh
